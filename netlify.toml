# Netlify builds the site from this repo on every push to main.
[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and its 15 credits) when only tooling or exports changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!tools' ':!shopify' ':!exports' ':!README.md'"

[build.environment]
  NODE_VERSION = "20"
